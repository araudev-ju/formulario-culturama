<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <img src="#" alt="logo culturama" class="logo">
    </header>
    <main>
        <section>
            <form action="" method="get">
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    <label for="userName">Nome</label>
                    <input type="text" name="userName" placeholder="Digite seu nome" required>
                    <br>
                    <label for="userAge">Idade</label>
                    <input type="number" name="userAge" placeholder="Digite sua idade" min="12" max="100" required>
                    <br>
                    <label for="birthdate">Data de Nascimento</label>
                    <input type="date"
                    name="birthdate" placeholder="Digite sua data de nascimento">
                    <br>
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="Digite seu email" required >
                    <br>
                    <label for="userPhoneNumber">Telefone</label>
                    <input type="tel" name="userPhoneNumber" 
                    pattern="[0-9]{11}"
                    placeholder="DDD+Numero" required>
                    <br>
                    <label for="userImage">Upload de foto</label>
                    <input type="file" accept="image/*" name="userImage">
                </fieldset>
                
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
