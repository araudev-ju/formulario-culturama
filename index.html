<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./culturama-favico.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <header>
      <img src="./img/logo.png" alt="logo culturama" class="logo" />
      <h1 class="texto-header">Pesquisa Culturama</h1>
    </header>
    <main>
      <section>
        <form action="" method="get">
          <fieldset>
            <!-- DADOS PESSOAIS -->
            <legend>Dados Pessoais</legend>
            <label for="name">Nome</label>
            <input
              type="text"
              name="userName"
              id="name"
              placeholder="Digite seu nome"
              required
            />
            <br />
            <label for="age">Idade</label>
            <input
              type="number"
              name="userAge"
              id="age"
              min="12"
              max="100"
              required
            />
            <br />
            <label for="birthdate">Data de Nascimento</label>
            <input type="date" name="birthdate" id="birthdate" />
            <br />
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Digite seu email"
              required
            />
            <br />
            <label for="telphone">Telefone</label>
            <input
              type="tel"
              name="userPhoneNumber"
              id="telphone"
              pattern="[0-9]{11}"
              placeholder="DDD+Numero"
              required
            />
            <br />
            <label for="image">Upload de foto</label>
            <input type="file" accept="image/*" name="userImage" id="image" />
          </fieldset>

          <fieldset>
            <!-- PERFIL -->
            <legend>Perfil</legend>

            <p>Gênero:</p>
            <input
              type="radio"
              name="userGender"
              value="Feminino"
              id="feminino"
            />
            <label for="feminino">Feminino</label>

            <input
              type="radio"
              name="userGender"
              value="Masculino"
              id="masculino"
            />
            <label for="masculino">Masculino</label>

            <input
              type="radio"
              name="userGender"
              value="nInformado"
              id="nInformado"
            />
            <label for="nInformado">Prefiro não informar</label>

            <br />

            <!-- ESTADO CIVIL -->
            <label for="maritalStatus">Estado Cívl:</label>

            <select name="userMaritalStatus" id="maritalStatus">
              <option value="casado">Casado(a)</option>
              <option value="solteiro">Solteiro(a)</option>
              <option value="viuvo">Viuvo(a)</option>
              <option value="divorciado">Divorciado(a)</option>
              <option value="uniaoEstavel">União Estável</option>
            </select>

            <label for="state">Estado:</label>
            <select name="Userstate" id="state" required>
              <option value="acre">Acre</option>
              <option value="alagoas">Alagoas</option>
              <option value="amapa">Amapá</option>
              <option value="amazonas">Amazonas</option>
              <option value="bahia">Bahia</option>
              <option value="ceara">Ceará</option>
              <option value="distritoFederal">Distrito Federal</option>
              <option value="espiritoSanto">Espirito Santo</option>
              <option value="goias">Goiás</option>
              <option value="maranhao">Maranhão</option>
              <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
              <option value="matoGrosso">Mato Grosso</option>
              <option value="minasGerais">Minas Gerais</option>
              <option value="para">Pará</option>
              <option value="paraiba">Paraíba</option>
              <option value="parana">Paraná</option>
              <option value="pernambuco">Pernambuco</option>
              <option value="piaui">Piauí</option>
              <option value="rioDeJaneiro">Rio de Janeiro</option>
              <option value="rioGrandedoNorte">Rio Grande do Norte</option>
              <option value="rioGrandedoSul">Rio Grande do Sul</option>
              <option value="rondonia">Rondônia</option>
              <option value="roraima">Roraima</option>
              <option value="santaCatarina">Santa Catarina</option>
              <option value="saoPaulo">São Paulo</option>
              <option value="sergipe">Sergipe</option>
              <option value="tocantins">Tocantins</option>
            </select>

            <br />

            <label for="city">Cidade</label>
            <input
              type="text"
              name="Usercity"
              id="city"
              placeholder="ex: Fortaleza"
            />
          </fieldset>

          <!-- HÁBITOS -->
          <fieldset>
            <legend>Hábitos</legend>
            <p>Redes Sociais</p>
            <input type="checkbox" id="X" name="social" value="X" />
            <label for="X">X</label>
            <br />
            <input
              type="checkbox"
              name="social"
              id="Instagram"
              value="Instagram"
            />
            <label for="Instagram">Instagram</label>
            <br />
            <input
              type="checkbox"
              name="social"
              id="Facebook"
              value="Facebook"
            />
            <label for="Facebook">Facebook</label>
            <br />
            <input
              type="checkbox"
              name="social"
              id="Linkedin"
              value="Linkedin"
            />
            <label for="Linkedin">Linkedin</label>

            <br />

            <label for="musicStyle">Estilo Musical</label>
            <input
              type="text"
              name="UserMusicStyle"
              id="musicStyle"
              placeholder="ex: Rock"
              list="stylesType"
            />
            <datalist id="stylesType">
              <option value="Rock"></option>
              <option value="Pop"></option>
              <option value="Sertanejo"></option>
              <option value="Funk"></option>
              <option value="Pagode"></option>
              <option value="Forró"></option>
              <option value="Axé"></option>
            </datalist>
            <br />
            <label for="favoriteColor">Cor Favorita</label>
            <input type="color" name="userColor" id="favoriteColor" />
          </fieldset>

          <fieldset>
            <legend>Opinião</legend>

            <p>O que você acha da qualidade do nosso serviço?</p>

            <input
              type="radio"
              name="userSatisfaction"
              id="otima"
              value="otima"
            />
            <label for="otima">Ótima</label>
            <br />

            <input type="radio" name="userSatisfaction" id="boa" value="boa" />
            <label for="boa">Boa</label>
            <br />

            <input
              type="radio"
              name="userSatisfaction"
              id="regular"
              value="regular"
            />
            <label for="regular">Regular</label>
            <br />

            <input
              type="radio"
              name="userSatisfaction"
              id="ruim"
              value="ruim"
            />
            <label for="ruim">Ruim</label>

            <br />
            <label for="commentSatisfaction">Escreva sua opinião</label>
            <textarea
              name="userSatisfaction"
              id="commentSatisfaction"
              cols="30"
              rows="3"
              placeholder="Digite sua opinião"
              style="resize: none"
            ></textarea>
          </fieldset>
          <fieldset>
            <legend>Confirmações</legend>

            <input
              type="checkbox"
              name="userConsent"
              id="consentLgpd"
              required
            />
            <label for="consentLgpd">Eu aceito participar da pesquisa</label>
            <br />
            <input type="checkbox" name="userResults" id="getResults" />
            <label for="getResults"
              >Desejo receber o resultado da pesquisa por email</label
            >
          </fieldset>
          <button type="submit">Enviar</button>
          <button type="reset">Limpar</button>
        </form>
      </section>
    </main>
  </body>
</html>
